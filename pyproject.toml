[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "babyllm-mobile"
version = "0.1.0"
description = "A reproducible, incremental language-memory research baseline"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "Apache-2.0"}
dependencies = []

[project.optional-dependencies]
neural = ["torch>=2.2"]
test = ["pytest>=8"]

[project.scripts]
babyllm = "babyllm.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
