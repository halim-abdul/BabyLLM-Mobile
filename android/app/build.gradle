plugins {
    id 'com.android.application'
}

android {
    namespace 'org.babyllm.mobile'
    compileSdk 35

    defaultConfig {
        applicationId 'org.babyllm.mobile'
        minSdk 28
        targetSdk 35
        versionCode 1
        versionName '0.2.0'
        testInstrumentationRunner 'android.test.InstrumentationTestRunner'
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    buildTypes {
        release {
            minifyEnabled false
        }
    }
}

dependencies {
    testImplementation 'junit:junit:4.13.2'
}
